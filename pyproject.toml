[project]
name = "finsight"
version = "1.0.0"
description = "Financial analysis powered by SEC EDGAR data, ML risk models, RAG over 10-K filings, and LangGraph orchestration."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "yfinance>=0.2.40",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "shap>=0.45.0",
    "joblib>=1.3.0",
    "statsmodels>=0.14.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "langchain-nvidia-ai-endpoints>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.5.0",
    "mcp[cli]>=1.0.0",
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 120
target-version = "py311"
